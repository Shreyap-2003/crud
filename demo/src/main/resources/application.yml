spring:
  application:
    name: demo1

  datasource:
    url: jdbc:mysql://localhost:3306/demo
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

  # show-sql: true

  web:
    error:
      include-message: always

server:
  port: 8080